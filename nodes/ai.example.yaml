# AI 专用节点池示例
# ───────────────────────────────────────────────────────────────
# 启用"AI 专用出口 IP 池"时用本文件的正式版：nodes/ai.yaml
#   1) 复制/新建：cp nodes/ai.example.yaml nodes/ai.yaml
#   2) 把你想【专门给 AI 用】的节点粘进下面的 proxies:（从各机场挑，
#      节点名叫什么都行——这里按"文件"圈定，不依赖名字规则/filter）
#   3) 在 config.yaml 里取消 ai_airport provider 的注释，并把
#      AI-FIXED / AI-STICKY 的 use 改成 [ai_airport]
#
# 只需 proxies: 段，格式与 clash 完全一致。真实文件 nodes/ai.yaml 已被 .gitignore 忽略。
#
# ⚠ 防封号建议：AI 站尽量用【静态住宅 IP】。机场常见的是数据中心 IP(如 Akamai/Linode/
#   Amazon)，能访问但风控更严。住宅代理服务商通常给 http/socks5 入口 + 账号密码，示例见文末。
# ⚠ 节点名务必含地区标识(🇺🇸/美国/US 等)，否则 config.yaml 的美国 filter 匹配不到。
# ───────────────────────────────────────────────────────────────
proxies:
  # —— 机场/数据中心节点示例（能用，但非住宅）——
  - name: "🇺🇸美国-01"
    type: ss
    server: ai-us01.airport-a.example.com
    port: 8443
    cipher: aes-256-gcm
    password: "your-password"

  - name: "🇺🇸美国-02"
    type: vmess
    server: ai-jp01.airport-b.example.com     # 来自另一个机场，名字风格不同也没关系
    port: 443
    uuid: 00000000-0000-0000-0000-000000000000
    alterId: 0
    cipher: auto
    tls: true

  # —— 静态住宅代理示例（防封号推荐，多为 socks5/http + 账号密码）——
  - name: "🇺🇸美国-住宅-socks5"
    type: socks5
    server: us.residential-provider.example.com
    port: 1080
    username: "your-user"
    password: "your-pass"
    udp: true
    # tls: true              # 若服务商要求 TLS 则开启
    # skip-cert-verify: true

  - name: "🇺🇸美国-住宅-http"
    type: http
    server: us.residential-provider.example.com
    port: 8080
    username: "your-user"
    password: "your-pass"
    # tls: true

