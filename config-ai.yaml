# mihomo(clash.meta) AI 出口实例网关配置（gateway-ai）
# ─────────────────────────────────────────────────────────────
# AI 出口实例：全部流量（MATCH 兜底）走美国节点聚合组，会话粘连防风控。
# 哪些域名发到本实例由客户端 PAC/插件决定——本实例不再维护任何域名清单。
# 节点来源与通用实例完全相同：共享 ./nodes/_merged.yaml。
# ─────────────────────────────────────────────────────────────

# mixed-port：同一端口同时支持 http 与 socks5 代理。
# 插件 PAC 中 AI 域名指向它；CLI(HTTP_PROXY) 默认指向它。
mixed-port: 7890

# 允许局域网/其他机器连接（这是"全公司连这台服务器"的关键开关）。
allow-lan: true
bind-address: '*'

mode: rule
log-level: info

# 管理 API（可选）：用于热重载、看节点健康状态。建议只绑本机。
external-controller: 127.0.0.1:9090

# ── 节点池：以文件 provider 方式读取你的 clash 节点 ──
proxy-providers:
  # 全量/通用节点池：由 scripts/build-config.sh 扫描 nodes/clash-*.yaml（+clash.yaml）
  # 合并生成的产物；与通用实例共享同一份 _merged.yaml。
  airport:
    type: file
    path: ./nodes/_merged.yaml
    # 主动健康检查：定期探测节点可用性，挂掉的自动剔除
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 180               # 秒

# ══════════════════════════════════════════════════════════════
# 代理组：两组——固定节点组（Meta 等风控严格服务）+ 美国节点聚合兜底出口
# ══════════════════════════════════════════════════════════════
proxy-groups:
  # 固定节点组（use: [airport] + filter 过滤固定名单）：风控严格服务（如 Meta）专用出口。
  # 名单 = 5 个「家宽」（住宅 IP）节点——住宅 IP 对 Meta 等严格风控服务的通过率显著高于
  # 数据中心 IP。会话粘连防风控。
  # 注意：曾混入 5 个「IX精品专线-美国XX-禁止大流量-x10」节点作兜底，已移除——
  # 它们共用同一中转服务器（zhuoyue-ali，单点无冗余），且「禁止大流量」不适合 AI 大流量
  # 用途、中转不稳定曾导致出口间歇性失败；这些节点也已从 AI-US-STICKY 排除，
  # 待机场中转恢复稳定后再视需要加回（本组 filter 加「禁止大流量」分支 +
  # STICKY 的 exclude-filter 去掉该关键词）。
  # 取舍说明：5 个家宽全部失效时本组为空、meta.ai 流量无兜底（有意取舍，风控优先）。
  # 维护方式：机场节点变化（节点下线/改名）时手动更新下方 filter 正则；
  # 可用 ./scripts/verify.sh 检查本组是否命中节点（组非空为硬性要求）。
  # 不开 lazy：组启动即健康检查，坏节点快速被剔除。
  - name: AI-US-HOME-FIXED
    type: load-balance
    strategy: sticky-sessions
    use: [airport]
    filter: "(?i)(美国\\d+-家宽-ss-x2)$"
    url: https://www.gstatic.com/generate_204
    interval: 60

  # ── AI-US-STICKY（sticky-sessions，会话粘连）★ 本实例兜底出口 ──
  # 跨机场聚合美国节点：用 filter 正则命中节点名里的美国关键词。
  # 「美」单字已收紧为常见机场命名组合（美国/美西/美东/美优化/美专线/美线），
  # 避免「完美」「美容」等含美字但非美国节点的误命中；「广美」保留（广州-美国专线）。
  # US 加词边界 \\bUS\\b，避免 Russia/BONUS 等含 us 的英文词误命中。
  # exclude-filter：排除港/台/日/韩/新/深/英等地区字符与机场信息/无效节点；
  # 另排除「禁止大流量」节点（「IX精品专线-美国XX-禁止大流量-x10」共用单中转
  # zhuoyue-ali，中转不稳曾致出口间歇失败，且限流节点不适 AI 大流量）。
  # 「中国」不排除：「美国-中国优化」类节点仍归美国组。
  # 含「港」的节点不归美国（如「香港-美西优化」应为香港节点）。
  # 会话粘连：同一会话一段时间内粘同一节点，防「多账号同一 IP」被风控。
  # 不开 lazy：组启动即健康检查，坏节点快速被剔除，避免流量粘到刚挂的节点。
  - name: AI-US-STICKY
    type: load-balance
    strategy: sticky-sessions
    use: [airport]           # 全量池（nodes/_merged.yaml，多机场合并产物）
    filter: "(?i)(美国落地|广美|美国|美西|美东|美优化|美专线|美线|\\bUS\\b|纽约|波特兰|达拉斯|俄勒|凤凰城|费利蒙|拉斯|洛杉|圣何塞|圣克拉|西雅|芝加|🇺🇸|United States)"
    exclude-filter: "(?i)(禁止大流量|测试|Pv|VPN|剩余|到期|过期|官网|重置|订阅|expire|traffic|港|台|日|韩|新|深|英)"
    url: https://www.gstatic.com/generate_204
    interval: 60

# ══════════════════════════════════════════════════════════════
# 路由规则：唯一一条 MATCH 兜底——发到本实例的流量一律美国出口。
# （AI 域名判定由客户端 PAC/插件完成，发到 7890 的流量默认全是 AI 域名。）
# ══════════════════════════════════════════════════════════════
rules:
  # ── 例外域名：风控严格服务走 AI-US-HOME-FIXED（固定家宽节点出口）──
  # 新增风控严格域名在此追加 DOMAIN-SUFFIX 行（须放在 MATCH 兜底之前）。
  - DOMAIN-SUFFIX,meta.ai,AI-US-HOME-FIXED   # Meta 风控严格，须住宅 IP 出口（固定家宽节点组）
  - MATCH,AI-US-STICKY

# ── 迁移期兼容（默认启用，插件侧端口切换完成后移除）──────────
# 旧插件 PAC 硬编码 10800；用 mihomo 官方 listeners 入站段额外监听，
# 流量进入全局 rules 命中 MATCH → AI-US-STICKY（美国出口），语义与主端口一致。
# ⚠ 必须用 listeners 段：mihomo 不存在顶层 ports 字段（那是 Surge 语法，
#   写了会被忽略、过渡监听静默失效）。插件侧端口切换完成后的下一变更移除本段。
listeners:
  - name: legacy-10800
    type: mixed
    port: 10800
    listen: 0.0.0.0
