services:
  # AI 出口实例：mihomo(clash.meta 内核)。规则只有 MATCH → AI-US-STICKY（美国出口）。
  # mixed-port 7890 同时提供 http 与 socks5：插件 PAC 中 AI 域名、CLI(HTTP_PROXY) 默认指向它。
  # 迁移期另以 listeners 段监听 10800 兼容旧插件（见 config-ai.yaml）。
  gateway-ai:
    image: metacubex/mihomo:latest
    container_name: ai-proxy-gateway-ai
    restart: unless-stopped
    network_mode: host          # 直接用宿主机网络，员工按宿主机 IP:7890 连接
    volumes:
      - ./config-ai.yaml:/root/.config/mihomo/config.yaml:ro
      - ./nodes:/root/.config/mihomo/nodes:ro    # 与通用实例共享同一节点池

  # 通用出口实例：mihomo(clash.meta 内核)。CN 直连 + 广告拦截 + MATCH → HK-STICKY（香港出口）。
  # mixed-port 7891 同时提供 http 与 socks5：全局 PAC 兜底、手动系统代理默认指向它。
  gateway-main:
    image: metacubex/mihomo:latest
    container_name: ai-proxy-gateway-main
    restart: unless-stopped
    network_mode: host          # 直接用宿主机网络，员工按宿主机 IP:7891 连接
    volumes:
      - ./config-main.yaml:/root/.config/mihomo/config.yaml:ro
      - ./nodes:/root/.config/mihomo/nodes:ro    # 你的 clash 节点文件放这里（两实例共享）
    # 如需限制端口而非 host 网络，去掉 network_mode 并改用 ports:
    #   - "7891:7891"   # http + socks5 (mixed-port)
    #   - "9091:9091"   # 管理 API(仅本机访问建议)

  # PAC 文件服务：给桌面 app / 操作系统级自动代理用(:19000/proxy.pac)。
  # 用 nginx 的 envsubst 把 GATEWAY_ADDR / AI_GATEWAY_ADDR 注入 PAC 模板，
  # PAC 内部按静态 AI 域名清单双端口分流：AI 域名 → 7890，其余 → 7891。
  pac:
    image: nginx:alpine
    container_name: ai-proxy-pac
    restart: unless-stopped
    ports:
      - "19000:80"
    environment:
      - GATEWAY_ADDR=${GATEWAY_ADDR:?请在 .env 里设置通用网关地址，例如 gateway.corp.example.com:7891}
      - AI_GATEWAY_ADDR=${AI_GATEWAY_ADDR:?请在 .env 里设置 AI 网关地址，例如 gateway.corp.example.com:7890}
      # 把 PAC 模板渲染结果输出到网站根目录，nginx.conf 里用 alias 指向它
      - NGINX_ENVSUBST_OUTPUT_DIR=/usr/share/nginx/html
    volumes:
      - ./www/proxy.pac.template:/etc/nginx/templates/proxy.pac.template:ro
      - ./www/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # 在 envsubst 前清洗 GATEWAY_ADDR / AI_GATEWAY_ADDR（剥掉误加的 http:// 前缀），防呆
      - ./www/15-sanitize-gateway.envsh:/docker-entrypoint.d/15-sanitize-gateway.envsh:ro
