server {
    listen 80;
    server_name _;

    # PAC 文件：/proxy.pac
    # 使用正确的 MIME 类型，部分系统/浏览器对 PAC 的 Content-Type 敏感。
    location = /proxy.pac {
        default_type application/x-ns-proxy-autoconfig;
        alias /usr/share/nginx/html/proxy.pac;
        add_header Cache-Control "no-cache";
    }

    location = /healthz {
        return 200 "ok\n";
    }
}
